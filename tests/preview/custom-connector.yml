# Vorschau-Beispiel: Prüfung des Custom Connectors mit beiden Parametern. Erwartet: in plan_<umgebung>
# nach terraform plan der Schritt „Custom Connector erkennen“ und der Job connector_check mit Checkout
# von seed-pipelines, Artefakt openapi und „Custom Connector prüfen“; im Deploy wie bisher der
# Schritt Custom Connector. Ob der Job wirklich läuft, entscheidet erst der Lauf (Output
# custom_connector); die Vorschau zeigt ihn immer.
# Platzhalter: __PROJECT__ und __ENVIRONMENT__ (die Environments <projekt>-<umgebung> und
# <projekt>-<umgebung>-app müssen im Projekt existieren), __SERVICE_CONNECTION__ (ebenso),
# __GITHUB_CONNECTION__.
trigger: none
pr: none

parameters:
  - name: allowBreakingConnectorChanges
    displayName: Breaking Changes am Custom Connector zulassen
    type: boolean
    default: false

resources:
  repositories:
    - repository: seed
      type: github
      name: blackforestsentinel/seed-pipelines
      ref: refs/heads/main
      endpoint: __GITHUB_CONNECTION__

extends:
  template: templates/web-app.yml@seed
  parameters:
    project: __PROJECT__
    serviceConnection: __SERVICE_CONNECTION__
    terraformState:
      resourceGroup: rg-preview
      storageAccount: stpreview
      container: tfstate
    environments:
      - name: __ENVIRONMENT__
    allowBreakingConnectorChanges: ${{ parameters.allowBreakingConnectorChanges }}
    checkConnectorConnections: true
