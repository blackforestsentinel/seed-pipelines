# Vorschau-Beispiel: Prüflauf (validationOnly) mit Browser-Erweiterung, aber ohne Frontend.
# Erwartet: Node genau einmal, vor „npm-Pakete prüfen“ und dotnet build; danach Build, Tests und
# Manifest-Prüfung der Erweiterung, kein npm ci des Frontends und keine Artefakte. Ohne Service
# Connection. Platzhalter: __GITHUB_CONNECTION__.
trigger: none
pr: none

resources:
  repositories:
    - repository: seed
      type: github
      name: blackforestsentinel/seed-pipelines
      ref: refs/heads/main
      endpoint: __GITHUB_CONNECTION__

extends:
  template: templates/web-app.yml@seed
  parameters:
    project: preview-app
    serviceConnection: sc-wird-nicht-gebraucht
    terraformState:
      resourceGroup: rg-preview
      storageAccount: stpreview
      container: tfstate
    validationOnly: true
    frontend: false
    extension:
      path: extension
