# Führt terraform init gegen den Remote-State aus und danach das übergebene Skript.
# Authentifizierung: Workload Identity Federation der Service Connection, per OIDC an
# die Provider und das azurerm-Backend durchgereicht. Keine Secrets.
parameters:
  - name: displayName
    type: string
  - name: serviceConnection
    type: string
  - name: workingDirectory
    type: string
  - name: terraformState
    type: object
  - name: stateKey
    type: string
  - name: script
    type: string
  # Optionaler Schrittname, nötig für Output-Variablen (isOutput=true)
  - name: name
    type: string
    default: ''
  # Zusätzliche Umgebungsvariablen, etwa geheime Variablen (die Pipeline reicht sie nur explizit durch)
  - name: env
    type: object
    default: {}
  # Optional: Verzeichnis, in das nach dem Skript die Outputs als outputs.json kommen
  # (Name -> Wert, ohne sensible Outputs). Der Deploy liest sie daraus statt aus dem State.
  - name: outputsDir
    type: string
    default: ''

steps:
  - task: AzureCLI@2
    displayName: ${{ parameters.displayName }}
    ${{ if ne(parameters.name, '') }}:
      name: ${{ parameters.name }}
    # Backend-Werte über die Umgebung statt als Text im Skript: Der State-Key kann aus einem
    # Laufzeit-Parameter stammen (seed-scaffold), und die Shell darf ihn nicht auswerten.
    env:
      SEED_TF_STATE_RESOURCE_GROUP: ${{ parameters.terraformState.resourceGroup }}
      SEED_TF_STATE_STORAGE_ACCOUNT: ${{ parameters.terraformState.storageAccount }}
      SEED_TF_STATE_CONTAINER: ${{ parameters.terraformState.container }}
      SEED_TF_STATE_KEY: ${{ parameters.stateKey }}
      ${{ insert }}: ${{ parameters.env }}
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      workingDirectory: ${{ parameters.workingDirectory }}
      inlineScript: |
        set -euo pipefail
        export ARM_USE_OIDC=true
        export ARM_OIDC_TOKEN="$idToken"
        export ARM_CLIENT_ID="$servicePrincipalId"
        export ARM_TENANT_ID="$tenantId"
        export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
        export TF_IN_AUTOMATION=true
        export TF_INPUT=false

        # Mit .terraform.lock.hcl (seed-template) nur die Provider-Versionen und Prüfsummen daraus:
        # init bricht ab, statt die Datei still zu ergänzen, etwa um einen neuen Provider.
        lockfile=""
        if [ -f .terraform.lock.hcl ]; then
          lockfile="-lockfile=readonly"
        fi
        terraform init $lockfile \
          -backend-config="resource_group_name=$SEED_TF_STATE_RESOURCE_GROUP" \
          -backend-config="storage_account_name=$SEED_TF_STATE_STORAGE_ACCOUNT" \
          -backend-config="container_name=$SEED_TF_STATE_CONTAINER" \
          -backend-config="key=$SEED_TF_STATE_KEY" \
          -backend-config="use_azuread_auth=true"

        ${{ parameters.script }}

        outputs_dir="${{ parameters.outputsDir }}"
        if [ -n "$outputs_dir" ]; then
          mkdir -p "$outputs_dir"
          # Sensible Outputs bleiben draußen: Das Artefakt kann jeder lesen, der den Lauf sieht.
          terraform output -json | python3 -c '
        import json, sys
        outputs = json.load(sys.stdin)
        json.dump({k: v["value"] for k, v in outputs.items() if not v.get("sensitive")}, sys.stdout, indent=2)
        ' > "$outputs_dir/outputs.json"
        fi
