# Secret-Scan mit gitleaks in fester Version, der Download wird per Prüfsumme geprüft.
# Im PR-Lauf ist HEAD der Merge-Commit: Geprüft werden alle Commits des PRs (HEAD^1..HEAD^2),
# denn ein Secret, das ein späterer Commit wieder entfernt, steht trotzdem in der Historie.
# Ohne Merge-Commit (validationOnly von Hand) prüft er die ganze Historie. Der Checkout
# braucht dafür fetchDepth: 0.
# Falscher Alarm: Fingerprint aus dem Log in .gitleaksignore im Projekt eintragen; eigene
# Regeln in .gitleaks.toml.
parameters:
  - name: version
    type: string
    default: '8.30.1'
  # SHA-256 von gitleaks_<version>_linux_x64.tar.gz laut gitleaks_<version>_checksums.txt
  - name: sha256
    type: string
    default: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

steps:
  - bash: |
      set -euo pipefail
      dir="$(Agent.ToolsDirectory)/gitleaks/${{ parameters.version }}"
      if [ ! -x "$dir/gitleaks" ]; then
        archive="$(Agent.TempDirectory)/gitleaks.tar.gz"
        curl -fsSL -o "$archive" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${{ parameters.version }}/gitleaks_${{ parameters.version }}_linux_x64.tar.gz"
        echo "${{ parameters.sha256 }}  $archive" | sha256sum --check --quiet
        mkdir -p "$dir"
        tar -xzf "$archive" -C "$dir" gitleaks
      fi
      if git rev-parse --quiet --verify 'HEAD^2' > /dev/null; then
        echo "Prüfe die Commits des PRs."
        set -- --log-opts='HEAD^1..HEAD^2'
      else
        echo "Kein Merge-Commit, prüfe die ganze Historie."
        set --
      fi
      # Exit-Code 2 für Funde, damit sie sich von Fehlern des Werkzeugs (1) unterscheiden.
      code=0
      "$dir/gitleaks" git --no-banner --redact --verbose --exit-code 2 "$@" . || code=$?
      if [ "$code" = 2 ]; then
        echo "##vso[task.logissue type=error]gitleaks meldet mögliche Secrets (Fundstellen oben, Werte geschwärzt). Secret entfernen und widerrufen; bei falschem Alarm den Fingerprint in .gitleaksignore eintragen."
      fi
      exit "$code"
    displayName: Secret-Scan (gitleaks ${{ parameters.version }})
