# Sentinel Seed: Pipeline für Web-Apps aus Static Web App und Azure Function.
#
# Projekte binden das Template per extends ein (siehe README). Nach Build und Tests
# je Umgebung:
#   plan_<env>    terraform plan, merkt sich, ob sich die Infrastruktur ändert
#   apply_<env>   nur bei Änderungen: Freigabe (Check am Environment <project>-<env>),
#                 dann terraform apply des geprüften Plans
#   deploy_<env>  Deploy von Function und Static Web App, Smoke-Test, mit
#                 features.customConnector der Custom Connector der Power Platform, mit
#                 extension das Paket der Browser-Erweiterung für diese Umgebung, mit
#                 extension.signing als CRX signiert und für verwaltete Geräte veröffentlicht
#                 (Environment <project>-<env>-app, lässt sich einzeln neu starten)
# Mit frontend: false (Projekt ohne Frontend) entfallen alle Schritte der Static Web App.
#
# PR-Läufe (Build.Reason PullRequest, ausgelöst von der Branch-Policy) und Läufe mit
# validationOnly: true bestehen nur aus Build und Tests samt Secret-Scan: kein Plan, kein
# Deploy, keine Service Connection. Eigene Schritte im Build (preBuildSteps, extraBuildSteps)
# laufen in beiden Fällen mit, ebenso Build und Tests der Browser-Erweiterung (extension).

parameters:
  # Projektname, muss mit project.yaml übereinstimmen. Daraus entstehen die Namen der
  # Azure-DevOps-Environments (<project>-<umgebung> für die Infrastruktur,
  # <project>-<umgebung>-app für den App-Deploy) und der State-Keys.
  - name: project
    type: string

  # Azure-Resource-Manager-Service-Connection mit Workload Identity Federation.
  # Kann je Umgebung überschrieben werden (environments[].serviceConnection).
  - name: serviceConnection
    type: string

  # Ablage des Terraform-States: resourceGroup, storageAccount, container.
  - name: terraformState
    type: object

  # Umgebungen in Deploy-Reihenfolge, z. B. [{name: dev}, {name: prod}].
  - name: environments
    type: object
    default:
      - name: dev

  # Projekt mit Frontend (Static Web App). false passt zu hosting.staticWebApp: none in
  # project.yaml: kein Frontend-Build, kein config.json, kein SWA-Deploy, Smoke-Test nur API.
  - name: frontend
    type: boolean
    default: true

  # Browser-Erweiterung (Edge, Manifest V3) als zweiter Client der API, ein Sonderfall. Ohne path
  # gibt es keine Erweiterung, und nichts ändert sich. Schlüssel (README: Browser-Erweiterung):
  #   path               Ordner der Erweiterung mit package.json, z. B. extension
  #   outputPath         Build-Ausgabe relativ zu path, Standard dist; dort liegt nach
  #                      npm run build die fertige manifest.json
  #   name               Dateiname der Pakete ohne Umgebung, Standard project
  #   storeEnvironments  Umgebungen, deren Paket in den Store geht (Edge Add-ons), Standard
  #                      [prod]. In deren Paket entfernt die Pipeline key aus dem Manifest, weil
  #                      der Store die ID selbst vergibt; in den übrigen bleibt key, damit die
  #                      entpackte Erweiterung ihre feste ID und damit ihre Redirect-URI behält.
  #   signing            optional, selbst gehostet statt Store: Der Deploy signiert das Paket als
  #                      CRX3 und veröffentlicht es im Container extension des Daten-Storage, von
  #                      wo Bfs.Seed.Extension es verwalteten Geräten ausliefert (README:
  #                      Browser-Erweiterung, Signieren und Veröffentlichen). Schlüssel:
  #     secureFile       Secure File im Azure-DevOps-Projekt mit dem privaten RSA-Schlüssel (PEM),
  #                      angelegt mit onboarding/New-SeedExtensionKey.ps1
  #     id               erwartete Erweiterungs-ID (32 Zeichen a bis p). Ergibt der Schlüssel eine
  #                      andere, bricht der Deploy vor dem Upload ab (falsche Secure File).
  #     environments     Umgebungen, in denen signiert wird, Standard [prod]; deren Pakete
  #                      bekommen wie die aus storeEnvironments kein key.
  - name: extension
    type: object
    default: {}

  # Nur prüfen wie im PR-Lauf (Build, Tests, Secret-Scan), etwa um die PR-Validierung von
  # Hand nachzustellen. PR-Läufe erkennt das Template selbst.
  - name: validationOnly
    type: boolean
    default: false

  # Zusätzliche Angaben für den Smoke-Test, alle optional:
  #   protectedPath  Pfad einer Function ohne [AllowAnonymous], z. B. api/me. Mit sso in
  #                  project.yaml muss sie ohne Token mit 401 antworten.
  - name: smokeTest
    type: object
    default: {}

  # Projektspezifische Schritte im Build-Job vor dotnet restore und npm ci, etwa die Anmeldung an
  # einem privaten Paket-Feed (NuGetAuthenticate@1, npmAuthenticate@0). Sie laufen nach terraform
  # validate und der Einrichtung des .NET SDK, auch im PR-Lauf. Arbeitsverzeichnis ist der
  # Checkout. Scheitert ein Schritt, scheitert der Build. Die Schritte bekommen keine
  # Azure-Service-Connection.
  - name: preBuildSteps
    type: stepList
    default: []

  # Projektspezifische Schritte im Build-Job, etwa eine zusätzliche Prüfung, ein Lint oder ein
  # weiteres Paket, das mit dem Frontend ausgeliefert wird. Sie laufen nach Build und Tests von API
  # und Frontend und vor dem Veröffentlichen des Artefakts web, auch im PR-Lauf. Arbeitsverzeichnis
  # ist der Checkout; was ein Schritt nach <frontendPath>/dist legt, geht mit ins Artefakt web.
  # Scheitert ein Schritt, scheitert der Build. Die Schritte bekommen keine Service Connection.
  - name: extraBuildSteps
    type: stepList
    default: []

  # Löschen von Daten bestätigen. Ein Plan, der Ressourcen aus protectedResourceTypes löscht
  # oder ersetzt, bricht sonst ab. Projekte reichen dafür einen Laufzeitparameter durch
  # (azure-pipelines.yml aus seed-template); bestätigt wird also nur in einem bewusst von Hand
  # gestarteten Lauf, danach folgt wie immer die Freigabe. Terraform bekommt in diesem Lauf
  # TF_VAR_allow_data_deletion=true; das Modul storage hebt damit seine Löschsperre auf, der
  # nächste Lauf ohne Bestätigung setzt sie wieder.
  - name: confirmDataDeletion
    type: boolean
    default: false

  # Ressourcentypen, deren Löschen oder Ersetzen confirmDataDeletion verlangt: Daten, die ein
  # Apply unwiederbringlich mitnehmen würde, und die Löschsperren selbst.
  - name: protectedResourceTypes
    type: object
    default:
      - azurerm_storage_account
      - azurerm_storage_container
      - azurerm_storage_queue
      - azurerm_storage_share
      - azurerm_storage_table
      - azurerm_key_vault
      - azurerm_log_analytics_workspace
      - azurerm_management_lock

  # Microsoft-gehosteter Agent; gilt nur, solange pool leer ist.
  - name: vmImage
    type: string
    default: ubuntu-24.04

  # Eigener Agent-Pool statt Microsoft-gehosteter Agents, z. B. Default. Linux-Agents mit bash,
  # curl, unzip, tar, git, python3 und Azure CLI (README, Eigene Agents).
  - name: pool
    type: string
    default: ''

  - name: nodeVersion
    type: string
    default: '24.x'

  - name: terraformVersion
    type: string
    default: '1.15.3'

  - name: apiProject
    type: string
    default: api/Api/Api.csproj

  - name: apiSolution
    type: string
    default: api/Api.slnx

  - name: frontendPath
    type: string
    default: frontend

  - name: infraPath
    type: string
    default: infra

stages:
  - stage: build
    displayName: Build und Tests
    jobs:
      # Ein Job statt drei (API, Frontend, Infrastruktur): Mit einem parallelen Job liefen sie
      # ohnehin nacheinander, und jeder brauchte einen eigenen Agent-Start.
      - job: build
        displayName: Build und Tests
        pool:
          ${{ if eq(parameters.pool, '') }}:
            vmImage: ${{ parameters.vmImage }}
          ${{ else }}:
            name: ${{ parameters.pool }}
        steps:
          - ${{ if or(eq(variables['Build.Reason'], 'PullRequest'), parameters.validationOnly) }}:
              # Ganze Historie, damit der Secret-Scan alle Commits des PRs sieht
              - checkout: self
                fetchDepth: 0
              - template: steps/secret-scan.yml
          - ${{ else }}:
              - checkout: self

          - bash: |
              set -euo pipefail
              actual="$(grep -E '^project:' project.yaml | awk '{print $2}' | tr -d "\"'")"
              if [ "$actual" != "${{ parameters.project }}" ]; then
                echo "##vso[task.logissue type=error]project.yaml nennt '$actual', die Pipeline '${{ parameters.project }}'."
                exit 1
              fi
              # hosting.staticWebApp: none gehört zu frontend: false und umgekehrt.
              static_web_app="$(awk '/^[[:space:]]+staticWebApp:/ { gsub(/["\047]/, "", $2); print tolower($2) }' project.yaml)"
              if [ "$static_web_app" = none ] && [ "${{ lower(parameters.frontend) }}" = true ]; then
                echo "##vso[task.logissue type=error]project.yaml hat hosting.staticWebApp: none, die Pipeline aber nicht frontend: false."
                exit 1
              fi
              if [ "$static_web_app" != none ] && [ "${{ lower(parameters.frontend) }}" = false ]; then
                echo "##vso[task.logissue type=error]Die Pipeline hat frontend: false, project.yaml aber nicht hosting.staticWebApp: none."
                exit 1
              fi
            displayName: project.yaml abgleichen
          - template: steps/terraform-install.yml
            parameters:
              version: ${{ parameters.terraformVersion }}
          - bash: |
              set -euo pipefail
              terraform fmt -check -recursive
              terraform init -backend=false -input=false
              terraform validate
            displayName: terraform fmt und validate
            workingDirectory: ${{ parameters.infraPath }}

          # Das .NET SDK des Images genügt, wenn es zu global.json passt (sonst scheitert
          # dotnet --version); dann entfällt der Download durch UseDotNet.
          - bash: |
              if sdk="$(dotnet --version 2>/dev/null)"; then
                echo ".NET SDK $sdk aus dem Image passt zu global.json."
                echo "##vso[task.setvariable variable=dotnetSdkReady]true"
              fi
            displayName: .NET SDK prüfen
          - task: UseDotNet@2
            displayName: .NET SDK laut global.json
            condition: and(succeeded(), ne(variables.dotnetSdkReady, 'true'))
            inputs:
              useGlobalJson: true

          # Projektspezifische Schritte (Parameter preBuildSteps) vor dem ersten Restore, damit etwa
          # die Anmeldung an einem privaten Feed für dotnet restore und npm ci gilt.
          - ${{ each step in parameters.preBuildSteps }}:
              - ${{ step }}

          # Fehlt die Anmeldung an einem privaten Feed, wiederholt dotnet restore die Anfrage mit
          # NU1301 (401) ohne Ende, und der Job stünde bis zu seinem Timeout. Sonst dauert der
          # Restore keine Minute.
          - bash: |
              set -uo pipefail
              timeout --kill-after=30 600 dotnet restore ${{ parameters.apiSolution }}
              code=$?
              # 124: timeout, 137: nach weiteren 30 s hart beendet
              if [ "$code" = 124 ] || [ "$code" = 137 ]; then
                echo "##vso[task.logissue type=error]dotnet restore nach 10 Minuten abgebrochen. Meldet das Log NU1301 mit 401, fehlt die Anmeldung an einem privaten Feed (Parameter preBuildSteps, README von seed-pipelines: Privater Paket-Feed)."
              fi
              exit "$code"
            displayName: dotnet restore
          - script: dotnet test --solution ${{ parameters.apiSolution }} --configuration Release --no-restore
            displayName: dotnet test
          - ${{ if not(or(eq(variables['Build.Reason'], 'PullRequest'), parameters.validationOnly)) }}:
              - script: >
                  dotnet publish ${{ parameters.apiProject }}
                  --configuration Release
                  --no-restore
                  --output $(Build.ArtifactStagingDirectory)/api
                  -p:InformationalVersion=$(Build.BuildNumber)
                  -p:SeedOpenApiPublishDir=$(Build.ArtifactStagingDirectory)/openapi
                displayName: dotnet publish
              - task: ArchiveFiles@2
                displayName: Paket packen
                inputs:
                  rootFolderOrFile: $(Build.ArtifactStagingDirectory)/api
                  includeRootFolder: false
                  archiveType: zip
                  archiveFile: $(Build.ArtifactStagingDirectory)/api.zip
              - publish: $(Build.ArtifactStagingDirectory)/api.zip
                artifact: api
                displayName: Artefakt api
              # OpenAPI-Dokument aus Bfs.Seed.OpenApi für den Custom Connector. Das Artefakt gibt es
              # immer, damit der Deploy es ohne Kenntnis der Features laden kann.
              - bash: |
                  set -euo pipefail
                  dir="$(Build.ArtifactStagingDirectory)/openapi"
                  mkdir -p "$dir"
                  if [ -f "$dir/openapi.json" ]; then
                    echo "OpenAPI-Dokument: $(wc -c < "$dir/openapi.json") Bytes"
                  else
                    echo "Kein OpenAPI-Dokument (Paket Bfs.Seed.OpenApi nicht im API-Projekt)." | tee "$dir/README.txt"
                  fi
                displayName: OpenAPI-Dokument
              - publish: $(Build.ArtifactStagingDirectory)/openapi
                artifact: openapi
                displayName: Artefakt openapi

          - ${{ if parameters.frontend }}:
              - task: UseNode@1
                displayName: Node ${{ parameters.nodeVersion }}
                inputs:
                  version: ${{ parameters.nodeVersion }}
              - script: npm ci
                displayName: npm ci
                workingDirectory: ${{ parameters.frontendPath }}
              - script: npm test
                displayName: npm test
                workingDirectory: ${{ parameters.frontendPath }}
              - script: npm run build
                displayName: npm run build
                workingDirectory: ${{ parameters.frontendPath }}

          # Browser-Erweiterung (Parameter extension), ein eigenes npm-Projekt. Node richtet sonst
          # der Frontend-Build ein.
          - ${{ if parameters.extension.path }}:
              - ${{ if not(parameters.frontend) }}:
                  - task: UseNode@1
                    displayName: Node ${{ parameters.nodeVersion }}
                    inputs:
                      version: ${{ parameters.nodeVersion }}
              - script: npm ci
                displayName: npm ci (Erweiterung)
                workingDirectory: ${{ parameters.extension.path }}
              - script: npm test
                displayName: npm test (Erweiterung)
                workingDirectory: ${{ parameters.extension.path }}
              - script: npm run build
                displayName: npm run build (Erweiterung)
                workingDirectory: ${{ parameters.extension.path }}
              # Prüft auch die Version, aus der der Deploy die Paketversion bildet; ein Fehler fiele
              # sonst erst nach dem Deploy der API auf.
              - bash: |
                  set -euo pipefail
                  python3 -c '
                  import json, os, re, sys
                  path = sys.argv[1]
                  def fail(message):
                      print("##vso[task.logissue type=error]" + message)
                      sys.exit(1)
                  try:
                      manifest = json.load(open(path, encoding="utf-8"))
                  except FileNotFoundError:
                      fail(f"{path} fehlt. npm run build muss die fertige Erweiterung samt manifest.json nach extension.outputPath legen (Standard dist).")
                  except ValueError as error:
                      fail(f"{path} ist kein gültiges JSON: {error}")
                  found = manifest.get("manifest_version", "nicht gesetzt")
                  if found != 3:
                      fail(f"{path}: manifest_version ist {found}, erwartet 3 (Manifest V3).")
                  version = manifest.get("version", "")
                  if not isinstance(version, str) or not re.fullmatch(r"(0|[1-9][0-9]{0,4})(\.(0|[1-9][0-9]{0,4})){0,3}", version) or max(map(int, version.split("."))) > 65535:
                      fail(f"{path}: version ist „{version}“, erwartet bis zu vier Zahlen von 0 bis 65535 ohne führende Nullen, z. B. 1.2.0.")
                  name = manifest.get("name")
                  print(f"{path}: {name} {version}, Manifest V3")

                  # extension.signing (nur dann gesetzt): Fehler hier statt erst im Deploy der Umgebung.
                  # Keine einfachen Anführungszeichen im Python: Es steht in einem davon in bash.
                  signing = json.loads(os.environ.get("SEED_EXTENSION_SIGNING") or "null")
                  if signing is not None:
                      if not isinstance(signing, dict):
                          fail("extension.signing: Objekt mit secureFile und id erwartet.")
                      unknown = ", ".join(sorted(set(signing) - {"secureFile", "id", "environments"}))
                      if unknown:
                          fail(f"extension.signing: unbekannt {unknown}; erlaubt sind secureFile, id und environments.")
                      secure_file = str(signing.get("secureFile") or "").strip()
                      extension_id = str(signing.get("id") or "")
                      if not secure_file:
                          fail("extension.signing.secureFile fehlt: Name der Secure File mit dem privaten Schlüssel (PEM).")
                      if not re.fullmatch(r"[a-p]{32}", extension_id):
                          fail(f"extension.signing.id ist „{extension_id}“, erwartet die Erweiterungs-ID (32 Zeichen a bis p), die onboarding/New-SeedExtensionKey.ps1 nennt.")
                      package = sys.argv[2]
                      if not re.fullmatch(r"[a-z0-9][a-z0-9-]{0,62}", package):
                          fail(f"extension.name (Standard project) ist „{package}“; signierte Pakete brauchen Kleinbuchstaben, Ziffern und Bindestriche, wie Bfs.Seed.Extension.")
                      wanted = signing.get("environments") or ["prod"]
                      wanted = [str(e).strip() for e in (wanted.split(",") if isinstance(wanted, str) else wanted)]
                      environments = [str(e.get("name")) for e in json.loads(os.environ["SEED_ENVIRONMENTS"])]
                      missing = ", ".join(e for e in wanted if e not in environments)
                      if missing:
                          fail(f"extension.signing.environments nennt {missing}, die Pipeline hat nur " + ", ".join(environments) + ". Ohne passende Umgebung signiert sie nie.")
                      print("Signieren und veröffentlichen in " + ", ".join(wanted) + f": {package}-<version>.crx, ID {extension_id}, Secure File {secure_file}")
                  ' "${{ parameters.extension.path }}/${{ coalesce(parameters.extension.outputPath, 'dist') }}/manifest.json" \
                    "${{ coalesce(parameters.extension.name, parameters.project) }}"
                displayName: Manifest der Erweiterung prüfen
                ${{ if parameters.extension.signing }}:
                  env:
                    SEED_EXTENSION_SIGNING: ${{ convertToJson(parameters.extension.signing) }}
                    SEED_ENVIRONMENTS: ${{ convertToJson(parameters.environments) }}

          # Projektspezifische Schritte (Parameter extraBuildSteps), nach den Builds und vor dem
          # Artefakt web, damit sie Dateien ins Frontend legen können.
          - ${{ each step in parameters.extraBuildSteps }}:
              - ${{ step }}

          - ${{ if and(parameters.frontend, not(or(eq(variables['Build.Reason'], 'PullRequest'), parameters.validationOnly))) }}:
              - publish: ${{ parameters.frontendPath }}/dist
                artifact: web
                displayName: Artefakt web
          - ${{ if and(parameters.extension.path, not(or(eq(variables['Build.Reason'], 'PullRequest'), parameters.validationOnly))) }}:
              - publish: ${{ parameters.extension.path }}/${{ coalesce(parameters.extension.outputPath, 'dist') }}
                artifact: extension
                displayName: Artefakt extension

  # PR-Läufe enden nach dem Build: Plan, Apply und Deploy entstehen gar nicht erst, damit
  # brauchen sie weder Service Connection noch Environments.
  - ${{ if not(or(eq(variables['Build.Reason'], 'PullRequest'), parameters.validationOnly)) }}:
      - ${{ each env in parameters.environments }}:
          - stage: plan_${{ env.name }}
            displayName: Plan ${{ env.name }}
            # Hängt implizit an der vorigen Stage (build bzw. deploy der vorigen Umgebung).
            # succeeded() wertet den ganzen Abhängigkeitsgraphen aus und wäre nach einem
            # übersprungenen apply der vorigen Umgebung (keine Änderungen) false; failed() sieht
            # den Graphen ebenso, ein gescheiterter Schritt davor hält die Umgebung also weiter auf.
            condition: not(or(failed(), canceled()))
            jobs:
              - job: plan
                displayName: terraform plan
                pool:
                  ${{ if eq(parameters.pool, '') }}:
                    vmImage: ${{ parameters.vmImage }}
                  ${{ else }}:
                    name: ${{ parameters.pool }}
                steps:
                  - checkout: self
                  - template: steps/terraform-install.yml
                    parameters:
                      version: ${{ parameters.terraformVersion }}
                  - template: steps/terraform.yml
                    parameters:
                      name: tfplan
                      displayName: terraform plan
                      serviceConnection: ${{ coalesce(env.serviceConnection, parameters.serviceConnection) }}
                      workingDirectory: $(Build.SourcesDirectory)/${{ parameters.infraPath }}
                      terraformState: ${{ parameters.terraformState }}
                      stateKey: ${{ parameters.project }}/${{ env.name }}.tfstate
                      outputsDir: $(Build.ArtifactStagingDirectory)/tfoutputs
                      script: |
                        # Nur in einem Lauf mit confirmDataDeletion; Projekte ohne die Variable
                        # ignorieren sie (TF_VAR_ für unbekannte Variablen ist kein Fehler).
                        export TF_VAR_allow_data_deletion=${{ lower(parameters.confirmDataDeletion) }}
                        set +e
                        terraform plan -var "environment=${{ env.name }}" -out=tfplan -detailed-exitcode
                        code=$?
                        set -e
                        case "$code" in
                          0) changes=false ;;
                          2) changes=true ;;
                          *) exit "$code" ;;
                        esac
                        # Ein Plan, der nur Ressourcen im State verschiebt (moved-Blöcke nach einem
                        # Modul-Update), ändert keine Infrastruktur und braucht keine Freigabe.
                        # Terraform wiederholt die Verschiebung bei jedem Plan; gespeichert wird sie
                        # mit dem nächsten Apply.
                        if [ "$changes" = true ] && terraform show -json tfplan | python3 -c '
                        import json, sys
                        plan = json.load(sys.stdin)
                        changed = [r for r in plan.get("resource_changes", []) if r["change"]["actions"] != ["no-op"] or r["change"].get("importing")]
                        changed += [o for o in (plan.get("output_changes") or {}).values() if o["actions"] != ["no-op"]]
                        sys.exit(1 if changed or plan.get("deferred_changes") else 0)
                        '; then
                          changes=false
                          echo "Der Plan verschiebt nur Ressourcen im State; an der Infrastruktur ändert sich nichts."
                        fi
                        echo "Infrastruktur-Änderungen: $changes"
                        # Schutz vor Datenverlust: Löschen oder Ersetzen geschützter Ressourcen nur
                        # mit confirmDataDeletion, sonst endet der Lauf hier, vor jeder Freigabe.
                        deletions=$(terraform show -json tfplan | python3 -c '
                        import json, sys
                        protected = set(sys.argv[1].split(","))
                        for r in json.load(sys.stdin).get("resource_changes", []):
                            if r["type"] in protected and "delete" in r["change"]["actions"]:
                                print(r["address"])
                        ' "${{ join(',', parameters.protectedResourceTypes) }}")
                        if [ -n "$deletions" ]; then
                          if [ "${{ lower(parameters.confirmDataDeletion) }}" = true ]; then
                            while read -r address; do
                              echo "##vso[task.logissue type=warning]Bestätigt: Der Plan löscht oder ersetzt $address."
                            done <<< "$deletions"
                          else
                            while read -r address; do
                              echo "##vso[task.logissue type=error]Der Plan löscht oder ersetzt $address."
                            done <<< "$deletions"
                            echo "##vso[task.logissue type=error]Datenlöschung ist nicht bestätigt. Ist sie gewollt, die Pipeline von Hand mit „Datenlöschung bestätigen“ starten und den Plan vor der Freigabe prüfen. Die Löschsperre der Storage Accounts hebt Terraform dann für diesen Lauf auf."
                            exit 1
                          fi
                        fi
                        # Der Plan enthält den State samt sensibler Werte im Klartext (etwa den
                        # Deployment-Token der Static Web App). Er liegt deshalb nicht als Artefakt
                        # am Lauf, das jeder mit Lesezugriff auf die Pipeline laden kann, sondern
                        # neben dem State im Container, auf den nur die Deployment-Identität kommt.
                        # apply löscht ihn; Pläne, die nie angewendet wurden (Freigabe abgelehnt oder
                        # abgelaufen), räumt der nächste Plan nach 31 Tagen ab.
                        if [ "$changes" = true ]; then
                          az storage blob upload --auth-mode login --only-show-errors -o none \
                            --account-name "${{ parameters.terraformState.storageAccount }}" \
                            --container-name "${{ parameters.terraformState.container }}" \
                            --name "plans/${{ parameters.project }}/${{ env.name }}/$(Build.BuildId).tfplan" \
                            --file tfplan --overwrite
                        fi
                        rm -f tfplan
                        # Zeitstempel im Format von az (2026-01-31T12:00:00+00:00), als Text vergleichbar
                        cutoff="$(date -u -d '31 days ago' +%Y-%m-%dT%H:%M:%S+00:00)"
                        az storage blob list --auth-mode login --only-show-errors \
                          --account-name "${{ parameters.terraformState.storageAccount }}" \
                          --container-name "${{ parameters.terraformState.container }}" \
                          --prefix "plans/${{ parameters.project }}/${{ env.name }}/" \
                          --query "[].[name, properties.lastModified]" -o tsv |
                          while read -r old modified; do
                            if [[ "$modified" < "$cutoff" ]]; then
                              az storage blob delete --auth-mode login --only-show-errors -o none \
                                --account-name "${{ parameters.terraformState.storageAccount }}" \
                                --container-name "${{ parameters.terraformState.container }}" --name "$old"
                            fi
                          done
                        echo "##vso[task.setvariable variable=changes;isOutput=true]$changes"
                        mkdir -p "$(Build.ArtifactStagingDirectory)/tfoutputs"
                        cp "$(Build.SourcesDirectory)/project.yaml" "$(Build.ArtifactStagingDirectory)/tfoutputs/"
                  # Ohne Änderungen gelten die Outputs aus dem State; sonst veröffentlicht apply sie.
                  - publish: $(Build.ArtifactStagingDirectory)/tfoutputs
                    artifact: tfoutputs_${{ env.name }}
                    displayName: Outputs als Artefakt
                    condition: and(succeeded(), eq(variables['tfplan.changes'], 'false'))

          - stage: apply_${{ env.name }}
            displayName: Apply ${{ env.name }}
            dependsOn: plan_${{ env.name }}
            # Ohne Änderungen entfällt die Stage und damit auch die Freigabe.
            # Ergebnis des eigenen Plans statt succeeded(), aus demselben Grund wie oben.
            condition: and(eq(dependencies.plan_${{ env.name }}.result, 'Succeeded'), eq(dependencies.plan_${{ env.name }}.outputs['plan.tfplan.changes'], 'true'))
            jobs:
              - deployment: apply
                displayName: terraform apply
                pool:
                  ${{ if eq(parameters.pool, '') }}:
                    vmImage: ${{ parameters.vmImage }}
                  ${{ else }}:
                    name: ${{ parameters.pool }}
                # Freigaben hängen als Check an diesem Environment.
                environment: ${{ parameters.project }}-${{ env.name }}
                strategy:
                  runOnce:
                    deploy:
                      steps:
                        - checkout: self
                        - template: steps/terraform-install.yml
                          parameters:
                            version: ${{ parameters.terraformVersion }}
                        - template: steps/terraform.yml
                          parameters:
                            displayName: terraform apply
                            serviceConnection: ${{ coalesce(env.serviceConnection, parameters.serviceConnection) }}
                            workingDirectory: $(Build.SourcesDirectory)/${{ parameters.infraPath }}
                            terraformState: ${{ parameters.terraformState }}
                            stateKey: ${{ parameters.project }}/${{ env.name }}.tfstate
                            outputsDir: $(Build.ArtifactStagingDirectory)/tfoutputs
                            script: |
                              # Der geprüfte Plan aus plan_<env>, abgelegt neben dem State (siehe dort)
                              plan_blob="plans/${{ parameters.project }}/${{ env.name }}/$(Build.BuildId).tfplan"
                              plan="$(Agent.TempDirectory)/tfplan"
                              az storage blob download --auth-mode login --only-show-errors -o none \
                                --account-name "${{ parameters.terraformState.storageAccount }}" \
                                --container-name "${{ parameters.terraformState.container }}" \
                                --name "$plan_blob" --file "$plan"
                              if ! terraform apply "$plan" 2>&1 | tee apply.log; then
                                if grep -q "Saved plan is stale" apply.log; then
                                  echo "##vso[task.logissue type=error]Der Plan ist veraltet, weil sich der State seit dem Plan geändert hat. Bitte einen neuen Lauf starten, damit ein frischer Plan zur Freigabe entsteht."
                                fi
                                exit 1
                              fi
                              rm -f "$plan" apply.log
                              az storage blob delete --auth-mode login --only-show-errors -o none \
                                --account-name "${{ parameters.terraformState.storageAccount }}" \
                                --container-name "${{ parameters.terraformState.container }}" \
                                --name "$plan_blob"
                              mkdir -p "$(Build.ArtifactStagingDirectory)/tfoutputs"
                              cp "$(Build.SourcesDirectory)/project.yaml" "$(Build.ArtifactStagingDirectory)/tfoutputs/"
                        - publish: $(Build.ArtifactStagingDirectory)/tfoutputs
                          artifact: tfoutputs_${{ env.name }}
                          displayName: Outputs als Artefakt

          - stage: deploy_${{ env.name }}
            displayName: Deploy ${{ env.name }}
            dependsOn:
              - plan_${{ env.name }}
              - apply_${{ env.name }}
            condition: and(eq(dependencies.plan_${{ env.name }}.result, 'Succeeded'), in(dependencies.apply_${{ env.name }}.result, 'Succeeded', 'Skipped'))
            jobs:
              - deployment: deploy
                displayName: Deploy und Smoke-Test
                pool:
                  ${{ if eq(parameters.pool, '') }}:
                    vmImage: ${{ parameters.vmImage }}
                  ${{ else }}:
                    name: ${{ parameters.pool }}
                environment: ${{ parameters.project }}-${{ env.name }}-app
                strategy:
                  runOnce:
                    deploy:
                      # Kein Checkout und kein terraform init: Pakete, Outputs und project.yaml
                      # kommen als Artefakte aus Build und Plan bzw. Apply. Nur mit
                      # extension.signing checkt der Paketschritt seed-pipelines aus (Skript).
                      steps:
                        - download: current
                          artifact: api
                        - ${{ if parameters.frontend }}:
                            - download: current
                              artifact: web
                        - download: current
                          artifact: tfoutputs_${{ env.name }}
                        - download: current
                          artifact: openapi
                        - ${{ if parameters.extension.path }}:
                            - download: current
                              artifact: extension

                        - bash: |
                            set -euo pipefail
                            outputs="$(Pipeline.Workspace)/tfoutputs_${{ env.name }}/outputs.json"
                            output() {
                              python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get(sys.argv[2]) or "")' "$outputs" "$1"
                            }
                            for name in resource_group_name function_app_name function_app_url static_web_app_name static_web_app_url; do
                              echo "##vso[task.setvariable variable=tf_${name}]$(output "$name")"
                            done
                            if [ "${{ lower(parameters.frontend) }}" = true ]; then
                              if [ -z "$(output static_web_app_name)" ]; then
                                echo "##vso[task.logissue type=error]Keine Static Web App im Terraform-Output. Für ein Projekt ohne Frontend frontend: false setzen."
                                exit 1
                              fi
                              web="$(Pipeline.Workspace)/web"
                              # Laufzeitkonfiguration des Frontends: Output frontend_config, sonst nur die API-URL
                              python3 -c '
                            import json, sys
                            outputs = json.load(open(sys.argv[1]))
                            config = outputs.get("frontend_config") or {"apiBaseUrl": outputs["function_app_url"]}
                            json.dump(config, open(sys.argv[2], "w"), indent=2)
                            ' "$outputs" "$web/config.json"
                              cat "$web/config.json"
                              echo
                              # Content-Security-Policy: Platzhalter __API_ORIGIN__ in connect-src durch den
                              # Ursprung der Function ersetzen. Bleibt er stehen, blockiert die CSP die API.
                              api_origin="$(output function_app_url | sed -E 's#^(https?://[^/]+).*$#\1#')"
                              if [ -f "$web/staticwebapp.config.json" ]; then
                                sed -i "s#__API_ORIGIN__#$api_origin#g" "$web/staticwebapp.config.json"
                                grep -o '"Content-Security-Policy": *"[^"]*"' "$web/staticwebapp.config.json" || true
                              fi
                            fi
                          ${{ if parameters.frontend }}:
                            displayName: Outputs, config.json und CSP
                          ${{ else }}:
                            displayName: Outputs

                        # Function-Deploy über Kudu (/api/publish) mit Entra-Token; Basic Auth ist an
                        # der Function abgeschaltet. Kudu verarbeitet das Paket rund eine Minute lang,
                        # in der Zeit läuft der Deploy der Static Web App. az functionapp deployment
                        # wartet danach fest 60 Sekunden und prüft den Host; das übernimmt hier der
                        # Smoke-Test, der zusätzlich die Build-Nummer vergleicht.
                        - task: AzureCLI@2
                          ${{ if parameters.frontend }}:
                            displayName: Function-Deploy starten, Token der Static Web App
                          ${{ else }}:
                            displayName: Function-Deploy starten
                          inputs:
                            azureSubscription: ${{ coalesce(env.serviceConnection, parameters.serviceConnection) }}
                            scriptType: bash
                            scriptLocation: inlineScript
                            inlineScript: |
                              set -euo pipefail
                              rg="$(tf_resource_group_name)"
                              app="$(tf_function_app_name)"
                              scm="$(az rest --method get \
                                --url "https://management.azure.com/subscriptions/{subscriptionId}/resourceGroups/$rg/providers/Microsoft.Web/sites/$app?api-version=2024-04-01" \
                                --query "properties.hostNameSslStates[?hostType=='Repository'].name | [0]" -o tsv)"
                              token="$(az account get-access-token --resource https://appservice.azure.com --query accessToken -o tsv)"
                              echo "##vso[task.setvariable variable=kudu_host]$scm"
                              echo "##vso[task.setvariable variable=kudu_token;issecret=true]$token"
                              id="none"
                              if response="$(curl --silent --show-error --fail-with-body -X POST \
                                -H @<(printf 'Authorization: Bearer %s\n' "$token") -H 'Content-Type: application/zip' \
                                --data-binary @"$(Pipeline.Workspace)/api/api.zip" \
                                "https://$scm/api/publish?RemoteBuild=false&Deployer=seed-pipelines")"; then
                                id="$(tr -d '"' <<< "$response")"
                                id="${id:-latest}"
                                echo "Function-Deploy $id gestartet."
                              else
                                echo "##vso[task.logissue type=warning]Function-Deploy nicht gestartet: $response"
                              fi
                              echo "##vso[task.setvariable variable=kudu_deployment]$id"

                              if [ "${{ lower(parameters.frontend) }}" = true ]; then
                                token="$(az staticwebapp secrets list --name "$(tf_static_web_app_name)" --resource-group "$rg" --query properties.apiKey -o tsv)"
                                echo "##vso[task.setvariable variable=swa_token;issecret=true]$token"
                                # Eigene Domains, die Azure noch nicht validiert hat: nötige DNS-Einträge als
                                # Warnung. Nur zur Information, der Deploy hängt nicht davon ab.
                                host="$(tf_static_web_app_url)"
                                host="${host#https://}"
                                az staticwebapp hostname list --name "$(tf_static_web_app_name)" --resource-group "$rg" \
                                  --query "[?status!='Ready'].[domainName, status, validationToken || '-']" -o tsv |
                                  while IFS=$'\t' read -r domain status validation; do
                                    echo "##vso[task.logissue type=warning]Eigene Domain $domain ist noch nicht bereit (Status $status). DNS: TXT _dnsauth.$domain = $validation, dazu CNAME $domain -> $host (Apex-Domain: ALIAS oder ANAME)."
                                  done ||
                                  echo "##vso[task.logissue type=warning]Status der eigenen Domains nicht abrufbar."
                              fi

                        - ${{ if parameters.frontend }}:
                            - task: AzureStaticWebApp@0
                              displayName: Static Web App deployen
                              inputs:
                                cwd: $(Pipeline.Workspace)/web
                                app_location: /
                                skip_app_build: true
                                skip_api_build: true
                                azure_static_web_apps_api_token: $(swa_token)

                        # Kudu-Status je Deployment: 0 bis 2 läuft, 3 fehlgeschlagen, 4 erfolgreich,
                        # 5 abgebrochen, 6 teilweise erfolgreich. Eine frisch angelegte Function
                        # antwortet einige Minuten mit 503, bis die Storage-Rollen ihrer Identität
                        # wirken; der Deploy endet dann mit 3 oder 6. Daher neue Versuche, bis zu
                        # 10 Minuten lang.
                        - bash: |
                            set -euo pipefail
                            auth() { printf 'Authorization: Bearer %s\n' "$KUDU_TOKEN"; }
                            publish() {
                              local response
                              if response="$(curl --silent --show-error --fail-with-body -X POST -H @<(auth) \
                                -H 'Content-Type: application/zip' --data-binary @"$(Pipeline.Workspace)/api/api.zip" \
                                "https://$(kudu_host)/api/publish?RemoteBuild=false&Deployer=seed-pipelines")"; then
                                response="$(tr -d '"' <<< "$response")"
                                echo "${response:-latest}"
                              else
                                echo "##vso[task.logissue type=warning]Function-Deploy nicht gestartet: $response" >&2
                                echo none
                              fi
                            }
                            status() {
                              curl --silent --max-time 15 -H @<(auth) "https://$(kudu_host)/api/deployments/$1" |
                                python3 -c 'import json, sys; d = json.load(sys.stdin); print(d.get("status"), d.get("status_text") or "-")' 2>/dev/null ||
                                echo "? -"
                            }
                            deadline=$((SECONDS + 600))
                            id="$(kudu_deployment)"
                            attempt=1
                            while :; do
                              while [ "$id" != none ] && [ "$SECONDS" -lt "$deadline" ]; do
                                read -r code text <<< "$(status "$id")"
                                case "$code" in
                                  4)
                                    echo "Function-Deploy $id erfolgreich (Versuch $attempt, $SECONDS s)."
                                    exit 0 ;;
                                  3|5|6|-1)
                                    echo "##vso[task.logissue type=warning]Function-Deploy $id, Versuch $attempt: Status $code ($text)."
                                    break ;;
                                esac
                                sleep 3
                              done
                              if [ $((SECONDS + 30)) -ge "$deadline" ]; then
                                echo "##vso[task.logissue type=error]Function-Deploy nach $attempt Versuchen nicht erfolgreich."
                                exit 1
                              fi
                              attempt=$((attempt + 1))
                              echo "Versuch $attempt in 30 Sekunden."
                              sleep 30
                              id="$(publish)"
                            done
                          displayName: Function-Deploy abwarten
                          env:
                            KUDU_TOKEN: $(kudu_token)

                        - template: steps/smoke-test.yml
                          parameters:
                            frontend: ${{ parameters.frontend }}
                            smokeTest: ${{ parameters.smokeTest }}
                            projectDir: $(Pipeline.Workspace)/tfoutputs_${{ env.name }}

                        # Nach dem Smoke-Test, damit der Connector erst auf die neue Version zeigt,
                        # wenn sie läuft. Ohne Output custom_connector tut der Schritt nichts.
                        - template: steps/custom-connector.yml
                          parameters:
                            serviceConnection: ${{ coalesce(env.serviceConnection, parameters.serviceConnection) }}
                            outputsFile: $(Pipeline.Workspace)/tfoutputs_${{ env.name }}/outputs.json
                            openApiFile: $(Pipeline.Workspace)/openapi/openapi.json

                        # Paket der Browser-Erweiterung für diese Umgebung (Parameter extension). Nach
                        # dem Smoke-Test, damit nur Pakete für einen laufenden Stand entstehen, und als
                        # letzter Schritt nach dem Custom Connector: Pipeline-Artefakte lassen sich nicht
                        # überschreiben, auch nicht beim Neustart eines gescheiterten Jobs. Stünde das
                        # Paket davor, käme deploy_<env> nach einem Fehler des Connectors mit einem
                        # Neustart nicht mehr durch. Mit extension.signing signiert und veröffentlicht der
                        # Schritt das Paket in dessen Umgebungen (Standard prod). Die Liste darf wie
                        # storeEnvironments auch ein einzelner Name sein: join macht aus beidem eine
                        # Aufzählung, split wieder eine Liste.
                        - ${{ if parameters.extension.path }}:
                            - template: steps/extension-package.yml
                              parameters:
                                name: ${{ coalesce(parameters.extension.name, parameters.project) }}
                                environment: ${{ env.name }}
                                ${{ if parameters.extension.storeEnvironments }}:
                                  storeEnvironments: ${{ parameters.extension.storeEnvironments }}
                                outputsFile: $(Pipeline.Workspace)/tfoutputs_${{ env.name }}/outputs.json
                                buildDir: $(Pipeline.Workspace)/extension
                                ${{ if parameters.extension.signing }}:
                                  sign: ${{ and(parameters.extension.signing.secureFile, containsValue(split(replace(join(',', coalesce(parameters.extension.signing.environments, 'prod')), ' ', ''), ','), env.name)) }}
                                  signing: ${{ parameters.extension.signing }}
                                  serviceConnection: ${{ coalesce(env.serviceConnection, parameters.serviceConnection) }}
                                  resourceGroup: $(tf_resource_group_name)
