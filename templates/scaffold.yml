# Sentinel Seed: Projekt anlegen (seed-scaffold), zentrales Scaffold zur Selbstbedienung.
#
# Legt Seed-Projekte in Azure DevOps und Azure an: auf Wunsch das Azure-DevOps-Projekt, das Repo
# mit seed-template an einem Tag, project.yaml und azure-pipelines.yml, Environments mit
# Freigaben, Pipeline, Branch-Policies und Git-Rechte; in Azure eine eigene Identität je Projekt
# (id-<name>) mit Rechten nur auf rg-<name>-<env> und dem State unter <name>/, und im Projekt die
# Service Connection sc-<name> für diese Identität. Grundlage ist das Terraform-Modul
# seed-terraform//ado-project ab v0.20.0; ein erneuter Lauf ändert nur, was fehlt.
#
# Das Scaffold ist ein Makler: Es führt nie Code aus dem Zielrepo oder aus seed-template aus,
# und es berechtigt die neue Pipeline erst, wenn Policies, Prüfungen und ein bekannter Inhalt
# stehen. Reihenfolge (README, Scaffold):
#   1 prüfen            Eingaben, Zielprojekt, Mitgliedschaft, Repo, Name (scaffold.py check, reserve)
#   2 identity          id-<name>, Resource Groups, Rollen, State-Pfad, Graph (nur sso)
#   3 fill              seed-template am Tag templateRef als ein Commit nach main
#   4 Terraform         ado-project: sc-<name> mit Prüfungen, Environments, Policies, Git-Rechte;
#                       danach identity federate mit Issuer und Subject von sc-<name>
#   5 verify            main enthält nur den Scaffold-Commit und Commits von Terraform
#   6 run               Pipeline für sc-<name> und GitHub berechtigen, ersten Lauf starten
#
# Modi:
#   createProject       legt das Azure-DevOps-Projekt adoProject an und nimmt die startende Person
#                       als Contributor auf. jobToken: Ende mit dem Hinweis, im Repo auf Initialize
#                       zu klicken und den Lauf mit mode new zu wiederholen (Repo-Schutz, README).
#                       servicePrincipal: weiter wie new, im selben Lauf.
#   new                 vorhandenes Projekt mit initialisiertem Repo (nur README, LICENSE, .gitignore)
#   migrate             vorhandenes Repo einrichten wie onboarding/Initialize-SeedProject.ps1, mit
#                       eigener Identität und Service Connection; keine Dateien
#   enableBranchPolicy  nach dem Umschalten: Branch-Policies (PR-Validierung, Reviewer)
# dryRun prüft nur.
#
# azureDevOpsAuth:
#   jobToken (Standard)  Job-Token, also die Build-Service-Identität dieses Projekts; ohne Lizenz.
#                        Sie braucht "Create new projects" (Organisation) bzw. im Zielprojekt das
#                        Opt-in (README). Unter "Protect access to repositories" sieht das Token nur
#                        Repos, die der Lauf referenziert; ein leeres Repo lässt sich nicht
#                        referenzieren, deshalb der Klick auf Initialize.
#   servicePrincipal     Entra-Token der Scaffold-Identität (scaffoldServiceConnection), die in
#                        Azure DevOps Benutzer mit Zugriffsstufe Basic ist; legt auch Repos an.
#   pat                  bis v0.19.0; bricht mit einem Hinweis ab.
#
# Eingaben der startenden Person (name, adoProject, repository, Listen) erreichen Skripte nur
# über die Umgebung, nie als Text im Skript.

parameters:
  - name: name
    type: string
  - name: sso
    type: boolean
    default: false
  # MCP-Server für KI-Werkzeuge, setzt sso voraus.
  - name: mcp
    type: boolean
    default: false
  # Eigener Storage Account mit Tabellen, Queues und Containern (Beispiel: Tabelle und Queue jobs).
  - name: storage
    type: boolean
    default: false
  # Projekt mit Frontend (Static Web App); false: nur API.
  - name: frontend
    type: boolean
    default: true
  - name: environments
    type: object
    default: [dev]
  # Principal Names (E-Mail) der Personen, die Infrastruktur-Änderungen freigeben.
  - name: approvers
    type: object
    default: []
  # Gruppen der Organisation (Name), deren Mitglieder ebenfalls freigeben; zentral optional eine
  # feste Gruppe (Onboarding -ApproverGroups).
  - name: approverGroups
    type: object
    default: []
  # Darf die startende Person die Infrastruktur ihres eigenen Laufs freigeben? Standard ja
  # (Einzelpersonen); Teams setzen false und nennen approvers oder approverGroups.
  - name: requesterCanApprove
    type: boolean
    default: true
  # Pflicht-Reviewer für Pull Requests auf main, ohne die eigene Stimme; 0 (Standard): keine.
  - name: minReviewers
    type: number
    default: 0
  # Umgebungen, in denen auch der App-Deploy eine Freigabe braucht.
  - name: appApprovalEnvironments
    type: object
    default: []
  # Principal Names (E-Mail), die Projektadministratoren des Projekts werden; Standard niemand aus
  # dem Team (ein Projektadmin kann Policies, Prüfungen und Freigaben seines Projekts aufheben).
  - name: projectAdministrators
    type: object
    default: []
  # Service Connection der Scaffold-Identität (id-seed-scaffold): State, Registry, Azure-Identität
  # des Projekts; bei servicePrincipal auch Azure DevOps.
  - name: scaffoldServiceConnection
    type: string
    default: ''
  # Bis v0.19.0: stateServiceConnection gilt weiter als scaffoldServiceConnection; die geteilte
  # Deployment-Service-Connection (serviceConnection) nutzt das Scaffold nicht mehr.
  - name: stateServiceConnection
    type: string
    default: ''
  - name: serviceConnection
    type: string
    default: ''
  - name: githubConnection
    type: string
  - name: terraformState
    type: object
  # Resource Group der Projektidentitäten und Region ihrer Resource Groups.
  - name: identityResourceGroup
    type: string
    default: rg-seed-identities
  - name: location
    type: string
    default: westeurope
  # Erster Lauf der neuen Pipeline direkt im Anschluss.
  - name: startFirstRun
    type: boolean
    default: true
  - name: azureDevOpsAuth
    type: string
    default: jobToken
    values: [jobToken, servicePrincipal, pat]
  # Zielprojekt (leer: dieses), Repo darin (leer: wie das Projekt) und Modus.
  - name: adoProject
    type: string
    default: ''
  - name: repository
    type: string
    default: ''
  - name: mode
    type: string
    default: new
    values: [createProject, new, migrate, enableBranchPolicy]
  - name: dryRun
    type: boolean
    default: false
  # Erlaubte Zielprojekte (regulärer Ausdruck für den ganzen Projektnamen, etwa 'Apps-.+', auch
  # für neue Projekte; leer: alle) und die Gruppe im Zielprojekt, in der die startende Person
  # Mitglied sein muss.
  - name: allowedProjects
    type: string
    default: ''
  - name: memberGroup
    type: string
    default: Contributors
  # Agent-Pool der neuen Projekt-Pipeline; leer: Microsoft-gehostete Agents.
  - name: projectPool
    type: string
    default: ''
  - name: templateUrl
    type: string
    default: https://github.com/blackforestsentinel/seed-template.git
  # Tag von seed-template, passend zum Release; nie ein Branch.
  - name: templateRef
    type: string
    default: v0.19.0
  - name: terraformModuleVersion
    type: string
    default: v0.20.0
  - name: pipelinesVersion
    type: string
    default: v0.21.1
  - name: terraformVersion
    type: string
    default: '1.15.3'
  # Microsoft-gehosteter Agent; gilt nur, solange pool leer ist.
  - name: vmImage
    type: string
    default: ubuntu-24.04
  # Eigener Agent-Pool statt Microsoft-gehosteter Agents. Linux-Agents mit bash, curl, unzip, tar,
  # git, python3 und Azure CLI (README, Eigene Agents); migrate und enableBranchPolicy zusätzlich
  # PowerShell 7.
  - name: pool
    type: string
    default: ''

stages:
  - stage: scaffold
    ${{ if eq(parameters.mode, 'createProject') }}:
      displayName: Projekt ${{ parameters.adoProject }} anlegen
    ${{ elseif eq(parameters.mode, 'new') }}:
      displayName: Projekt ${{ parameters.name }} anlegen
    ${{ else }}:
      displayName: Projekt ${{ parameters.name }} (${{ parameters.mode }})
    jobs:
      - job: scaffold
        displayName: Projekt, Identität, Repo, Pipeline
        pool:
          ${{ if eq(parameters.pool, '') }}:
            vmImage: ${{ parameters.vmImage }}
          ${{ else }}:
            name: ${{ parameters.pool }}
        workspace:
          clean: all
        steps:
          # --- 1. Prüfen, vor allem anderen, damit kein halbes Projekt entsteht -----------------
          # Den Namen gibt die startende Person ein. Skripte bekommen ihn nur über die Umgebung,
          # nie als Text im Skript; die Meldung nennt ihn nicht, damit er keine Logging-Befehle
          # (##vso[...]) ausgeben kann.
          - bash: |
              if [[ ! "$SEED_NAME" =~ ^[a-z][a-z0-9-]{1,18}[a-z0-9]$ ]]; then
                echo "##vso[task.logissue type=error]name: 3-20 Zeichen, Kleinbuchstaben, Ziffern und Bindestriche, beginnt mit einem Buchstaben."
                exit 1
              fi
            displayName: Name prüfen
            env:
              SEED_NAME: ${{ parameters.name }}
          - ${{ if eq(parameters.azureDevOpsAuth, 'pat') }}:
              - bash: |
                  echo "##vso[task.logissue type=error]azureDevOpsAuth pat gibt es ab v0.20.0 nicht mehr: jobToken (Standard) oder servicePrincipal, siehe README, Scaffold, Umstieg."
                  exit 1
                displayName: Anmeldung prüfen
          - ${{ if eq(coalesce(parameters.scaffoldServiceConnection, parameters.stateServiceConnection), '') }}:
              - bash: |
                  echo "##vso[task.logissue type=error]scaffoldServiceConnection fehlt: Service Connection der Scaffold-Identität (onboarding/Initialize-SeedTenant.ps1 -CentralScaffold)."
                  exit 1
                displayName: Service Connection prüfen
          - ${{ if ne(parameters.serviceConnection, '') }}:
              - bash: |
                  echo "##vso[task.logissue type=warning]serviceConnection wird ab v0.20.0 nicht mehr genutzt: Jedes Projekt bekommt eine eigene Service Connection sc-<name>."
                displayName: Hinweis serviceConnection
          - ${{ if and(parameters.mcp, not(parameters.sso)) }}:
              - bash: |
                  echo "##vso[task.logissue type=error]mcp setzt sso voraus: Die MCP-Anmeldung läuft über die App-Registrierung des Features sso."
                  exit 1
                displayName: Features prüfen

          - checkout: seed
            path: seed

          # Diese Referenz gibt dem Job-Token Zugriff auf das Repo im Zielprojekt (Protect access to
          # repositories), ohne es auszuchecken: Inhalt und Token liegen nie gemeinsam auf dem Agent,
          # und nichts aus dem Repo läuft. Inline, weil resources.repositories keine
          # Template-Ausdrücke erlaubt. Ein leeres Repo lässt Azure DevOps hier nicht zu (Lauf wird
          # schon bei der Validierung abgewiesen); deshalb bei new vorher Initialize. Beim ersten
          # Lauf je Repo hält Azure DevOps den Lauf an, bis die startende Person die Ressource
          # freigibt (View, Permit); die Freigabe bleibt für das Repo bestehen.
          - ${{ if and(ne(parameters.mode, 'createProject'), eq(parameters.azureDevOpsAuth, 'jobToken'), ne(coalesce(parameters.repository, parameters.adoProject), '')) }}:
              - checkout: git://${{ coalesce(parameters.adoProject, variables['System.TeamProject']) }}/${{ coalesce(parameters.repository, parameters.adoProject) }}
                condition: false
                displayName: Zielrepo referenzieren (ohne Checkout)

          - template: steps/scaffold-token.yml
            parameters:
              azureDevOpsAuth: ${{ parameters.azureDevOpsAuth }}
              serviceConnection: ${{ coalesce(parameters.scaffoldServiceConnection, parameters.stateServiceConnection) }}

          - bash: |
              set -euo pipefail
              python3 "$(Pipeline.Workspace)/seed/scripts/scaffold/scaffold.py" check \
                --name "$SEED_NAME" --mode "$SEED_MODE" --ado-project "$SEED_ADO_PROJECT" \
                --repository "$SEED_REPOSITORY" --allowed-projects "$SEED_ALLOWED_PROJECTS" \
                --member-group "$SEED_MEMBER_GROUP" --connection "$SEED_GITHUB_CONNECTION"
            displayName: Zielprojekt, Person und Repo prüfen
            env:
              SEED_AZDO_TOKEN: $(seedAzdoToken)
              SEED_AZDO_AUTH: ${{ parameters.azureDevOpsAuth }}
              SEED_NAME: ${{ parameters.name }}
              SEED_MODE: ${{ parameters.mode }}
              SEED_ADO_PROJECT: ${{ coalesce(parameters.adoProject, variables['System.TeamProject']) }}
              SEED_REPOSITORY: ${{ coalesce(parameters.repository, parameters.adoProject) }}
              SEED_ALLOWED_PROJECTS: ${{ parameters.allowedProjects }}
              SEED_MEMBER_GROUP: ${{ parameters.memberGroup }}
              SEED_GITHUB_CONNECTION: ${{ parameters.githubConnection }}

          # --- createProject: Projekt anlegen (Weg J endet hier mit dem Hinweis) ------------------
          - ${{ if eq(parameters.mode, 'createProject') }}:
              - bash: |
                  set -euo pipefail
                  args=(--ado-project "$SEED_ADO_PROJECT" --name "$SEED_NAME")
                  if [ "$SEED_DRY_RUN" = true ]; then args+=(--dry-run); fi
                  python3 "$(Pipeline.Workspace)/seed/scripts/scaffold/scaffold.py" create-project "${args[@]}"
                displayName: Azure-DevOps-Projekt anlegen
                env:
                  SEED_AZDO_TOKEN: $(seedAzdoToken)
                  SEED_AZDO_AUTH: ${{ parameters.azureDevOpsAuth }}
                  SEED_NAME: ${{ parameters.name }}
                  SEED_ADO_PROJECT: ${{ parameters.adoProject }}
                  SEED_DRY_RUN: ${{ lower(parameters.dryRun) }}

          # Name in die Registry, für jeden Modus; im dryRun nur prüfen.
          - ${{ if or(ne(parameters.mode, 'createProject'), not(parameters.dryRun)) }}:
              - task: AzureCLI@2
                displayName: Namen prüfen und eintragen
                env:
                  SEED_NAME: ${{ parameters.name }}
                  SEED_MODE: ${{ parameters.mode }}
                  SEED_PROJECT_ID: $(seedProjectId)
                  SEED_PROJECT_NAME: $(seedProjectName)
                  SEED_REPOSITORY: $(seedRepository)
                  SEED_ENVIRONMENTS: ${{ convertToJson(parameters.environments) }}
                  SEED_STORAGE_ACCOUNT: ${{ parameters.terraformState.storageAccount }}
                  SEED_CONTAINER: ${{ parameters.terraformState.container }}
                  SEED_DRY_RUN: ${{ lower(parameters.dryRun) }}
                inputs:
                  azureSubscription: ${{ coalesce(parameters.scaffoldServiceConnection, parameters.stateServiceConnection) }}
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -euo pipefail
                    args=(--name "$SEED_NAME" --mode "$SEED_MODE" --project-id "$SEED_PROJECT_ID"
                          --project-name "$SEED_PROJECT_NAME" --repository "$SEED_REPOSITORY"
                          --environments-json "$SEED_ENVIRONMENTS"
                          --storage-account "$SEED_STORAGE_ACCOUNT" --container "$SEED_CONTAINER")
                    if [ "$SEED_DRY_RUN" = true ]; then args+=(--dry-run); fi
                    python3 "$(Pipeline.Workspace)/seed/scripts/scaffold/scaffold.py" reserve "${args[@]}"

          # --- new (und createProject mit servicePrincipal) --------------------------------------
          - ${{ if or(eq(parameters.mode, 'new'), and(eq(parameters.mode, 'createProject'), eq(parameters.azureDevOpsAuth, 'servicePrincipal'), not(parameters.dryRun))) }}:
              # 2. Identität des Projekts in Azure
              - task: AzureCLI@2
                displayName: Projektidentität anlegen
                env:
                  SEED_NAME: ${{ parameters.name }}
                  SEED_ENVIRONMENTS: ${{ convertToJson(parameters.environments) }}
                  SEED_SSO: ${{ lower(parameters.sso) }}
                  SEED_LOCATION: ${{ parameters.location }}
                  SEED_IDENTITY_RESOURCE_GROUP: ${{ parameters.identityResourceGroup }}
                  SEED_STATE_RESOURCE_GROUP: ${{ parameters.terraformState.resourceGroup }}
                  SEED_STORAGE_ACCOUNT: ${{ parameters.terraformState.storageAccount }}
                  SEED_CONTAINER: ${{ parameters.terraformState.container }}
                  SEED_DRY_RUN: ${{ lower(parameters.dryRun) }}
                inputs:
                  azureSubscription: ${{ coalesce(parameters.scaffoldServiceConnection, parameters.stateServiceConnection) }}
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -euo pipefail
                    args=(--name "$SEED_NAME" --environments-json "$SEED_ENVIRONMENTS" --sso "$SEED_SSO"
                          --location "$SEED_LOCATION" --identity-resource-group "$SEED_IDENTITY_RESOURCE_GROUP"
                          --state-resource-group "$SEED_STATE_RESOURCE_GROUP"
                          --storage-account "$SEED_STORAGE_ACCOUNT" --container "$SEED_CONTAINER")
                    if [ "$SEED_DRY_RUN" = true ]; then args+=(--dry-run); fi
                    python3 "$(Pipeline.Workspace)/seed/scripts/scaffold/scaffold.py" identity "${args[@]}"

              # 3. seed-template am Tag als ein Commit nach main
              - bash: |
                  set -euo pipefail
                  args=(--project-id "$SEED_PROJECT_ID" --repository "$SEED_REPOSITORY"
                        --template-url "$SEED_TEMPLATE_URL" --template-ref "$SEED_TEMPLATE_REF")
                  if [ "$SEED_DRY_RUN" = true ]; then args+=(--dry-run); fi
                  python3 "$(Pipeline.Workspace)/seed/scripts/scaffold/scaffold.py" fill "${args[@]}"
                displayName: seed-template ins Repo
                env:
                  SEED_AZDO_TOKEN: $(seedAzdoToken)
                  SEED_AZDO_AUTH: ${{ parameters.azureDevOpsAuth }}
                  SEED_PROJECT_ID: $(seedProjectId)
                  SEED_REPOSITORY: $(seedRepository)
                  SEED_TEMPLATE_URL: ${{ parameters.templateUrl }}
                  SEED_TEMPLATE_REF: ${{ parameters.templateRef }}
                  SEED_DRY_RUN: ${{ lower(parameters.dryRun) }}

              - ${{ if parameters.dryRun }}:
                  - bash: |
                      echo "##vso[task.logissue type=warning]dryRun: alle Prüfungen bestanden, nichts geändert."
                    displayName: Nur geprüft (dryRun)

              - ${{ if not(parameters.dryRun) }}:
                  - bash: |
                      set -euo pipefail
                      python3 "$(Pipeline.Workspace)/seed/scripts/scaffold/scaffold.py" share \
                        --project-id "$SEED_PROJECT_ID" --connection "$SEED_GITHUB_CONNECTION"
                    displayName: GitHub-Service-Connection ins Zielprojekt teilen
                    env:
                      SEED_AZDO_TOKEN: $(seedAzdoToken)
                      SEED_PROJECT_ID: $(seedProjectId)
                      SEED_GITHUB_CONNECTION: ${{ parameters.githubConnection }}

                  # 4. Terraform: Service Connection sc-<name> mit Prüfungen, Environments, Policies
                  - template: steps/terraform-install.yml
                    parameters:
                      version: ${{ parameters.terraformVersion }}
                  - template: steps/scaffold-config.yml
                    parameters:
                      name: ${{ parameters.name }}
                      sso: ${{ parameters.sso }}
                      mcp: ${{ parameters.mcp }}
                      storage: ${{ parameters.storage }}
                      frontend: ${{ parameters.frontend }}
                      environments: ${{ parameters.environments }}
                      approvers: ${{ parameters.approvers }}
                      approverGroups: ${{ parameters.approverGroups }}
                      requesterCanApprove: ${{ parameters.requesterCanApprove }}
                      minReviewers: ${{ parameters.minReviewers }}
                      appApprovalEnvironments: ${{ parameters.appApprovalEnvironments }}
                      githubConnection: ${{ parameters.githubConnection }}
                      terraformState: ${{ parameters.terraformState }}
                      pipelinesVersion: ${{ parameters.pipelinesVersion }}
                      projectPool: ${{ parameters.projectPool }}
                      projectAdministrators: ${{ parameters.projectAdministrators }}
                      templateUrl: ${{ parameters.templateUrl }}
                      terraformModuleVersion: ${{ parameters.terraformModuleVersion }}
                  - template: steps/scaffold-token.yml
                    parameters:
                      azureDevOpsAuth: ${{ parameters.azureDevOpsAuth }}
                      serviceConnection: ${{ coalesce(parameters.scaffoldServiceConnection, parameters.stateServiceConnection) }}
                  - template: steps/terraform.yml
                    parameters:
                      name: scaffold
                      displayName: terraform apply
                      serviceConnection: ${{ coalesce(parameters.scaffoldServiceConnection, parameters.stateServiceConnection) }}
                      workingDirectory: $(Agent.TempDirectory)/scaffold
                      terraformState: ${{ parameters.terraformState }}
                      stateKey: scaffold/$(seedProjectId)/${{ parameters.name }}.tfstate
                      env:
                        SEED_AZDO_TOKEN: $(seedAzdoToken)
                        SEED_AZDO_AUTH: ${{ parameters.azureDevOpsAuth }}
                      script: |
                        export AZDO_ORG_SERVICE_URL="$(System.CollectionUri)"
                        # jobToken: das Token als PAT. servicePrincipal: kein PAT, der Provider meldet
                        # sich per OIDC mit derselben Identität an wie das azurerm-Backend (ARM_*).
                        if [ "$SEED_AZDO_AUTH" = jobToken ]; then
                          export AZDO_PERSONAL_ACCESS_TOKEN="$SEED_AZDO_TOKEN"
                        fi
                        terraform apply -auto-approve
                        echo "##vso[task.setvariable variable=pipelineId]$(terraform output -raw pipeline_id)"
                        echo "##vso[task.setvariable variable=seedFederationIssuer]$(terraform output -raw workload_identity_federation_issuer)"
                        echo "##vso[task.setvariable variable=seedFederationSubject]$(terraform output -raw workload_identity_federation_subject)"
                        echo "Repo: $(terraform output -raw repository_url)"
                  - task: AzureCLI@2
                    displayName: Federated Credential für sc-${{ parameters.name }}
                    env:
                      SEED_NAME: ${{ parameters.name }}
                      SEED_IDENTITY_RESOURCE_GROUP: ${{ parameters.identityResourceGroup }}
                      SEED_ISSUER: $(seedFederationIssuer)
                      SEED_SUBJECT: $(seedFederationSubject)
                    inputs:
                      azureSubscription: ${{ coalesce(parameters.scaffoldServiceConnection, parameters.stateServiceConnection) }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      inlineScript: |
                        set -euo pipefail
                        python3 "$(Pipeline.Workspace)/seed/scripts/scaffold/scaffold.py" identity federate \
                          --name "$SEED_NAME" --identity-resource-group "$SEED_IDENTITY_RESOURCE_GROUP" \
                          --issuer "$SEED_ISSUER" --subject "$SEED_SUBJECT"

                  # 5. Inhalt prüfen, bevor die Pipeline die Service Connection bekommt
                  - bash: |
                      set -euo pipefail
                      python3 "$(Pipeline.Workspace)/seed/scripts/scaffold/scaffold.py" verify \
                        --project-id "$SEED_PROJECT_ID" --repository "$SEED_REPOSITORY" --commit "$SEED_SCAFFOLD_COMMIT"
                    displayName: main prüfen
                    env:
                      SEED_AZDO_TOKEN: $(seedAzdoToken)
                      SEED_PROJECT_ID: $(seedProjectId)
                      SEED_REPOSITORY: $(seedRepository)
                      SEED_SCAFFOLD_COMMIT: $(seedScaffoldCommit)

                  # 6. Berechtigen und ersten Lauf starten
                  - bash: |
                      set -euo pipefail
                      args=(--project-id "$SEED_PROJECT_ID" --pipeline-id "$SEED_PIPELINE_ID"
                            --authorize "sc-$SEED_NAME" --authorize "$SEED_GITHUB_CONNECTION")
                      if [ "$SEED_START" != true ]; then args+=(--no-start); fi
                      python3 "$(Pipeline.Workspace)/seed/scripts/scaffold/scaffold.py" run "${args[@]}"
                      if [ "$SEED_START" = true ]; then
                        echo "##vso[task.logissue type=warning]Der erste Lauf wartet auf die Freigabe der Infrastruktur."
                      fi
                    displayName: Pipeline berechtigen und ersten Lauf starten
                    env:
                      SEED_AZDO_TOKEN: $(seedAzdoToken)
                      SEED_NAME: ${{ parameters.name }}
                      SEED_PROJECT_ID: $(seedProjectId)
                      SEED_PIPELINE_ID: $(pipelineId)
                      SEED_GITHUB_CONNECTION: ${{ parameters.githubConnection }}
                      SEED_START: ${{ lower(parameters.startFirstRun) }}

          # --- migrate und enableBranchPolicy: wie onboarding/Initialize-SeedProject.ps1 -----------
          - ${{ if in(parameters.mode, 'migrate', 'enableBranchPolicy') }}:
              - task: AzureCLI@2
                displayName: Projektidentität anlegen
                env:
                  SEED_NAME: ${{ parameters.name }}
                  SEED_ENVIRONMENTS: ${{ convertToJson(parameters.environments) }}
                  SEED_SSO: ${{ lower(parameters.sso) }}
                  SEED_LOCATION: ${{ parameters.location }}
                  SEED_IDENTITY_RESOURCE_GROUP: ${{ parameters.identityResourceGroup }}
                  SEED_STATE_RESOURCE_GROUP: ${{ parameters.terraformState.resourceGroup }}
                  SEED_STORAGE_ACCOUNT: ${{ parameters.terraformState.storageAccount }}
                  SEED_CONTAINER: ${{ parameters.terraformState.container }}
                  SEED_DRY_RUN: ${{ lower(parameters.dryRun) }}
                inputs:
                  azureSubscription: ${{ coalesce(parameters.scaffoldServiceConnection, parameters.stateServiceConnection) }}
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -euo pipefail
                    args=(--name "$SEED_NAME" --environments-json "$SEED_ENVIRONMENTS" --sso "$SEED_SSO"
                          --location "$SEED_LOCATION" --identity-resource-group "$SEED_IDENTITY_RESOURCE_GROUP"
                          --state-resource-group "$SEED_STATE_RESOURCE_GROUP"
                          --storage-account "$SEED_STORAGE_ACCOUNT" --container "$SEED_CONTAINER")
                    if [ "$SEED_DRY_RUN" = true ]; then args+=(--dry-run); fi
                    python3 "$(Pipeline.Workspace)/seed/scripts/scaffold/scaffold.py" identity "${args[@]}"
              - ${{ if not(parameters.dryRun) }}:
                  - bash: |
                      set -euo pipefail
                      python3 "$(Pipeline.Workspace)/seed/scripts/scaffold/scaffold.py" share \
                        --project-id "$SEED_PROJECT_ID" --connection "$SEED_GITHUB_CONNECTION"
                    displayName: GitHub-Service-Connection ins Zielprojekt teilen
                    env:
                      SEED_AZDO_TOKEN: $(seedAzdoToken)
                      SEED_PROJECT_ID: $(seedProjectId)
                      SEED_GITHUB_CONNECTION: ${{ parameters.githubConnection }}
                  # Ohne Terraform (es schriebe Dateien): Service Connection sc-<name> per API, mit
                  # Branch-Prüfung auf den Default-Branch und Required template am Tag pipelinesVersion.
                  - bash: |
                      set -euo pipefail
                      python3 "$(Pipeline.Workspace)/seed/scripts/scaffold/scaffold.py" connection \
                        --project-id "$SEED_PROJECT_ID" --name "$SEED_NAME" --tenant-id "$SEED_TENANT_ID" \
                        --subscription-id "$SEED_SUBSCRIPTION_ID" --subscription-name "$SEED_SUBSCRIPTION_NAME" \
                        --client-id "$SEED_IDENTITY_CLIENT_ID" --default-branch "$SEED_DEFAULT_BRANCH" \
                        --pipelines-version "$SEED_PIPELINES_VERSION"
                    displayName: Service Connection sc-${{ parameters.name }}
                    env:
                      SEED_AZDO_TOKEN: $(seedAzdoToken)
                      SEED_PROJECT_ID: $(seedProjectId)
                      SEED_NAME: ${{ parameters.name }}
                      SEED_TENANT_ID: $(seedTenantId)
                      SEED_SUBSCRIPTION_ID: $(seedSubscriptionId)
                      SEED_SUBSCRIPTION_NAME: $(seedSubscriptionName)
                      SEED_IDENTITY_CLIENT_ID: $(seedIdentityClientId)
                      SEED_DEFAULT_BRANCH: $(seedDefaultBranch)
                      SEED_PIPELINES_VERSION: ${{ parameters.pipelinesVersion }}
                  - task: AzureCLI@2
                    displayName: Federated Credential für sc-${{ parameters.name }}
                    env:
                      SEED_NAME: ${{ parameters.name }}
                      SEED_IDENTITY_RESOURCE_GROUP: ${{ parameters.identityResourceGroup }}
                      SEED_ISSUER: $(seedFederationIssuer)
                      SEED_SUBJECT: $(seedFederationSubject)
                    inputs:
                      azureSubscription: ${{ coalesce(parameters.scaffoldServiceConnection, parameters.stateServiceConnection) }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      inlineScript: |
                        set -euo pipefail
                        python3 "$(Pipeline.Workspace)/seed/scripts/scaffold/scaffold.py" identity federate \
                          --name "$SEED_NAME" --identity-resource-group "$SEED_IDENTITY_RESOURCE_GROUP" \
                          --issuer "$SEED_ISSUER" --subject "$SEED_SUBJECT"
              - pwsh: |
                  $arguments = @{
                      AzureDevOpsOrganization = $env:SYSTEM_COLLECTIONURI.TrimEnd('/')
                      AzureDevOpsProject      = $env:SEED_PROJECT_ID
                      Repository              = $env:SEED_REPOSITORY
                      SeedProjectName         = $env:SEED_NAME
                      DefaultBranch           = $env:SEED_DEFAULT_BRANCH
                      Environments            = [string[]] @($env:SEED_ENVIRONMENTS | ConvertFrom-Json)
                      Approvers               = [string[]] @($env:SEED_APPROVERS | ConvertFrom-Json)
                      ApproverGroups          = [string[]] @($env:SEED_APPROVER_GROUPS | ConvertFrom-Json)
                      AppApprovalEnvironments = [string[]] @($env:SEED_APP_APPROVAL_ENVIRONMENTS | ConvertFrom-Json)
                      ServiceConnectionName   = "sc-$($env:SEED_NAME)"
                      GitHubConnectionName    = $env:SEED_GITHUB_CONNECTION
                      MinReviewers            = [int] $env:SEED_MIN_REVIEWERS
                      Pool                    = $env:SEED_PROJECT_POOL
                      # Branch-Prüfung und Required template hat scaffold.py connection gesetzt.
                      SkipBranchControl       = $true
                  }
                  if ($env:SEED_REQUESTER_CAN_APPROVE -eq 'true') { $arguments.RequesterCanApprove = $true }
                  if ($env:SEED_MODE -eq 'enableBranchPolicy') { $arguments.EnableBranchPolicy = $true }
                  if ($env:SEED_DRY_RUN -eq 'true') { $arguments.DryRun = $true }
                  & "$(Pipeline.Workspace)/seed/onboarding/Initialize-SeedProject.ps1" @arguments
                displayName: Projekt einrichten (${{ parameters.mode }})
                env:
                  SEED_AZDO_TOKEN: $(seedAzdoToken)
                  SEED_PROJECT_ID: $(seedProjectId)
                  SEED_DEFAULT_BRANCH: $(seedDefaultBranch)
                  SEED_NAME: ${{ parameters.name }}
                  SEED_MODE: ${{ parameters.mode }}
                  SEED_REPOSITORY: $(seedRepository)
                  SEED_ENVIRONMENTS: ${{ convertToJson(parameters.environments) }}
                  SEED_APPROVERS: ${{ convertToJson(parameters.approvers) }}
                  SEED_APPROVER_GROUPS: ${{ convertToJson(parameters.approverGroups) }}
                  SEED_APP_APPROVAL_ENVIRONMENTS: ${{ convertToJson(parameters.appApprovalEnvironments) }}
                  SEED_GITHUB_CONNECTION: ${{ parameters.githubConnection }}
                  SEED_MIN_REVIEWERS: ${{ parameters.minReviewers }}
                  SEED_REQUESTER_CAN_APPROVE: ${{ lower(parameters.requesterCanApprove) }}
                  SEED_PROJECT_POOL: ${{ parameters.projectPool }}
                  SEED_DRY_RUN: ${{ lower(parameters.dryRun) }}
