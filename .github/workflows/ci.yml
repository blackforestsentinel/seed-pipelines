name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # Actions per Commit-SHA statt Tag, den ein Angreifer verschieben könnte; Dependabot hebt sie
      # an (.github/dependabot.yml). Das Token bleibt nicht im Checkout liegen.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python 3.12 und openssl aus dem Image, wie auf den Agents der Pipelines; alle Tests unter
      # scripts/ (extension, intune), nur Standardbibliothek
      - name: Tests der Skripte
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v
      # Nur Syntax: Die Skripte selbst brauchen Azure und Azure DevOps.
      - name: PowerShell-Syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Recurse -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref] $null, [ref] $errors) | Out-Null
            foreach ($e in $errors) {
              Write-Host "::error file=$($file.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
