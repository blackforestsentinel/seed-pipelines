# Sentinel Seed: zentrales Scaffold. Legt Azure-DevOps-Projekte und Seed-Projekte an und richtet
# vorhandene Repos ein, ohne Admin-Rechte der startenden Person. Jedes Seed-Projekt bekommt eine
# eigene Identität in Azure mit Rechten nur auf seine Resource Groups.
# Angelegt vom Tenant-Onboarding (onboarding/Initialize-SeedTenant.ps1 -CentralScaffold).
#
# Neues Azure-DevOps-Projekt: mode createProject, adoProject = Name des neuen Projekts. Danach im
# Repo auf Initialize klicken (mit README) und den Lauf mit mode new wiederholen.
# Vorhandenes Projekt: einmal Opt-in durch einen Projektadmin (README, Scaffold); bei new legt die
# Person das Repo selbst an (Repos, New repository, mit README) und gibt seinen Namen an.
trigger: none
pr: none

parameters:
  - name: adoProject
    displayName: Zielprojekt (Azure-DevOps-Projekt)
    type: string
  - name: repository
    displayName: Repo im Zielprojekt (leer = wie das Projekt; bei new vorher anlegen, mit README)
    type: string
    default: ' '
  - name: mode
    displayName: "createProject: Azure-DevOps-Projekt anlegen, new: Seed-Projekt im initialisierten Repo, migrate: vorhandenes Repo einrichten, enableBranchPolicy: nach dem Umschalten"
    type: string
    default: new
    values: [createProject, new, migrate, enableBranchPolicy]
  - name: name
    displayName: Projektname (3-20 Zeichen, a-z, 0-9, Bindestrich)
    type: string
  - name: sso
    displayName: Login mit Entra ID (sso)
    type: boolean
    default: false
  - name: mcp
    displayName: MCP-Server für KI-Werkzeuge (mcp, setzt sso voraus)
    type: boolean
    default: false
  - name: storage
    displayName: Storage Account mit Tabellen und Queues (storage)
    type: boolean
    default: false
  - name: frontend
    displayName: Mit Frontend (Static Web App); aus = nur API
    type: boolean
    default: true
  - name: environments
    displayName: Umgebungen in Deploy-Reihenfolge
    type: object
    default: [dev]
  - name: approvers
    displayName: Freigabe für Infrastruktur-Änderungen (E-Mail-Adressen; leer und ohne Gruppe = keine Freigabe)
    type: object
    default: []
  - name: requesterCanApprove
    displayName: Wer den Lauf startet, darf seine Infrastruktur-Änderungen selbst freigeben
    type: boolean
    default: __REQUESTER_CAN_APPROVE__
  - name: minReviewers
    displayName: Pflicht-Reviewer für Pull Requests auf main (eigene Stimme zählt nicht; 0 = keine)
    type: number
    default: __MIN_REVIEWERS__
  - name: appApprovalEnvironments
    displayName: Umgebungen, in denen auch der App-Deploy eine Freigabe braucht
    type: object
    default: []
  - name: startFirstRun
    displayName: Ersten Lauf der neuen Pipeline starten
    type: boolean
    default: true
  - name: dryRun
    displayName: Nur prüfen, nichts ändern
    type: boolean
    default: false

resources:
  repositories:
    - repository: seed
      type: github
      name: blackforestsentinel/seed-pipelines
      ref: refs/tags/__SEED_PIPELINES_VERSION__
      endpoint: __GITHUB_CONNECTION__

extends:
  template: templates/scaffold.yml@seed
  parameters:
    azureDevOpsAuth: __AZURE_DEVOPS_AUTH__
    adoProject: ${{ parameters.adoProject }}
    repository: ${{ trim(parameters.repository) }}
    mode: ${{ parameters.mode }}
    name: ${{ parameters.name }}
    sso: ${{ parameters.sso }}
    mcp: ${{ parameters.mcp }}
    storage: ${{ parameters.storage }}
    frontend: ${{ parameters.frontend }}
    environments: ${{ parameters.environments }}
    approvers: ${{ parameters.approvers }}
    requesterCanApprove: ${{ parameters.requesterCanApprove }}
    minReviewers: ${{ parameters.minReviewers }}
    appApprovalEnvironments: ${{ parameters.appApprovalEnvironments }}
    startFirstRun: ${{ parameters.startFirstRun }}
    dryRun: ${{ parameters.dryRun }}
    # Fest, nicht beim Start änderbar:
    allowedProjects: '__ALLOWED_PROJECTS__'
    memberGroup: '__MEMBER_GROUP__'
    approverGroups: __APPROVER_GROUPS__
    # Projektadministratoren neuer Projekte (Principal Names, E-Mail); Standard niemand aus dem Team.
    projectAdministrators: __PROJECT_ADMINISTRATORS__
    pipelinesVersion: __SEED_PIPELINES_VERSION__
    templateRef: __TEMPLATE_REF__
    githubConnection: __GITHUB_CONNECTION__
    scaffoldServiceConnection: __SCAFFOLD_CONNECTION__
    identityResourceGroup: __IDENTITY_RESOURCE_GROUP__
    location: __LOCATION__
    terraformState:
      resourceGroup: __STATE_RESOURCE_GROUP__
      storageAccount: __STATE_STORAGE_ACCOUNT__
      container: __STATE_CONTAINER__
    pool: '__POOL__'
    projectPool: '__PROJECT_POOL__'
